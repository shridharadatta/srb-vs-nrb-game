<style>
:root{--bg:#0b0d1a;--panel:rgba(255,255,255,.95);--ink:#14182a;--mute:#566079;--line:rgba(20,24,42,.22);--acc:#d9531e;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(16,18,36,.95);--ink:#f3efe8;--mute:#a9aec4;--line:rgba(255,255,255,.22);--acc:#ff8a4c;--accink:#14182a}}
:root[data-theme="dark"]{--panel:rgba(16,18,36,.95);--ink:#f3efe8;--mute:#a9aec4;--line:rgba(255,255,255,.22);--acc:#ff8a4c;--accink:#14182a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:12px;box-sizing:border-box}
.card{background:var(--panel);color:var(--ink);border-radius:16px;padding:18px;width:min(540px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
.card h1{font:700 clamp(36px,8vw,54px)/1 "Saira Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.card h2{font:700 28px/1.1 "Saira Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.card p{line-height:1.45;margin:8px 0}
small{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 0}
button{font:inherit;cursor:pointer}
.b{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.g{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);width:110px;text-transform:lowercase}
#msg{color:var(--acc);min-height:1.2em}
#ctl{display:none;gap:8px;padding:6px 8px;background:#0e1124}
#ctl .pn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px}
.mv,.ac{display:flex;gap:6px}
#ctl button{min-width:52px;height:52px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);color:#fff;font:600 14px/1 "Saira",sans-serif;touch-action:none;padding:0 8px}
#ctl button.s{border-color:#ffb347}
#splash{position:fixed;inset:0;z-index:9999;background:#050505;display:flex;align-items:center;justify-content:center;padding:24px;opacity:1;transition:opacity .25s ease}
#splash img{display:block;max-width:min(92vw,900px);max-height:86vh;object-fit:contain}
#splash.hide{opacity:0;pointer-events:none}
@media (pointer:fine){#ctl{display:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2h5MoelfLHCYWqBNgtQEeoGOkCeuj0Xk",
  authDomain: "srb-vs-nrb.firebaseapp.com",
  databaseURL: "https://srb-vs-nrb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "srb-vs-nrb",
  storageBucket: "srb-vs-nrb.firebasestorage.app",
  messagingSenderId: "950199927471",
  appId: "1:950199927471:web:7d9370cdd4c6f002ea8a5a",
  measurementId: "G-23LTXGP1VH"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const gameAuth = firebase.auth();
const gameDb = firebase.database();
let gameDbConnected = false;
gameDb.ref('.info/connected').on('value', s => { gameDbConnected = s.val() === true; });

window.startFirebaseRoom = async function(role, code) {
  const user = gameAuth.currentUser || (await gameAuth.signInAnonymously()).user;
  const uid = user.uid;
  const roomRef = gameDb.ref('rooms/' + code);
  const ownRef = roomRef.child(role === 'h' ? 'host' : 'guest');
  const peerRef = roomRef.child(role === 'h' ? 'guest' : 'host');
  const initialPresence = { r: role };
  const existing = await ownRef.once('value');
  if (existing.exists()) throw new Error(role === 'h' ? 'code-taken' : 'room-full');
  await ownRef.set({ uid, presence: initialPresence });
  await ownRef.onDisconnect().remove();

  let peer = null;
  const peerListener = snap => {
    const value = snap.val();
    peer = value && value.presence ? { isMe: false, presence: value.presence } : null;
  };
  peerRef.on('value', peerListener);

  return {
    peers: () => peer ? [peer] : [],
    presence: pr => ownRef.update({ presence: pr }),
    connected: () => gameDbConnected,
    leave: async () => {
      peerRef.off('value', peerListener);
      try { await ownRef.onDisconnect().cancel(); } catch (e) {}
      await ownRef.remove();
    }
  };
};
</script>

const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');

const hh=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const A={p:{d:.3,a:[.08,.18],dm:CFG.punch,r:70,h:[-105,-45]},k:{d:.42,a:[.12,.26],dm:CFG.kick,r:92,h:[-75,0]},s:{d:.65,a:[.2,.42],dm:CFG.special,r:135,h:[-115,0]}};

let F=[mk(0),mk(1)],MODE='menu',NET=0,ME=0,ROLE='',R=null,CODE='',PH='lobby',PT=0,TL=CFG.seconds,RN=1,Wn=[0,0],WN=-2,SH=0,T=0,ENDD=0,NT=0,hid=0;

let ac=null;
function beep(f,d,tp){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=tp||'square';o.frequency.value=f;v.gain.value=.04;o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- fighting rules ---------- */
function hurt(v,d,dir){
 if(v.hp<=0||PH!=='fight')return;
 const blk=v.blk&&v.face===-dir;
 if(blk){d*=.2;v.kx=dir*60;v.hs=.08}else{v.hs=.32;v.kx=dir*320;v.at=null;v.st='hit'}
 v.hp=Math.max(0,v.hp-d);v.sp=Math.min(100,v.sp+d*.8);SH=blk?.15:.4;beep(blk?200:110,.1,'sawtooth');FX.push({x:v.x,y:v.y-80,a:1});
}
function strike(f,o,a){
 const x0=f.x+f.face*20,x1=f.x+f.face*(20+a.r),lx=Math.min(x0,x1),hx=Math.max(x0,x1),y0=f.y+a.h[0],y1=f.y+a.h[1];
 if(o.hp>0&&hx>o.x-24&&lx<o.x+24&&y1>o.y-120&&y0<o.y){
  f.done=1;f.sp=Math.min(100,f.sp+a.dm*1.5);
  if(NET){MY.hits.push({id:NONCE+(++hid),d:a.dm,dir:f.face});if(MY.hits.length>4)MY.hits.shift();FX.push({x:o.x,y:o.y-80,a:1});beep(150,.08,'sawtooth')}
  else hurt(o,a.dm,f.face);
 }
}
function stepLocal(f,o,dt,inp,pend){
 const gr=f.y>=GY;f.blk=0;
 if(f.hp<=0){f.st='ko';f.at=null}
 else if(f.hs>0){f.hs-=dt;f.x+=f.kx*dt;f.kx*=.92;if(f.hs<=0)f.st='idle'}
 else if(f.at){const a=A[f.at];f.t+=dt;if(f.t>=a.a[0]&&f.t<=a.a[1]&&!f.done)strike(f,o,a);if(f.t>=a.d){f.at=null;f.st='idle'}}
 else{
  f.blk=inp.b&&gr?1:0;const mv=inp.r-inp.l;
  f.vx=f.blk?0:mv*CFG.speed;f.x+=f.vx*dt;
  if(pend.u&&gr&&!f.blk)f.vy=-CFG.jump;
  const atk=pend.p?'p':pend.k?'k':(pend.s&&f.sp>=100)?'s':null;
  if(atk&&!f.blk){f.at=atk;f.t=0;f.done=0;if(atk==='s')f.sp=0;beep(atk==='s'?420:300,.1)}
  f.st=f.blk?'block':!gr?'jump':mv?'walk':'idle';
 }
 pend.u=pend.p=pend.k=pend.s=0;
 f.vy+=1900*dt;f.y+=f.vy*dt;if(f.y>=GY){f.y=GY;f.vy=0}
 const dx=f.x-o.x;if(Math.abs(dx)<42&&Math.abs(f.y-o.y)<60)f.x+=(dx>=0?1:-1)*(42-Math.abs(dx))*.5;
 f.x=Math.max(30,Math.min(770,f.x));
 if(!f.at&&f.hs<=0&&f.hp>0)f.face=o.x>=f.x?1:-1;
 f.anim+=dt*(Math.abs(f.vx)>1?1:.3);
}
function resetRound(){
 PH='ready';PT=2.2;TL=CFG.seconds;
 if(MODE==='net'){F[ME]=mk(ME);F[1-ME].init=0}else F=[mk(0),mk(1)];
}
function ctrl(dt){
 if(PH==='ready'){PT-=dt;if(PT<=0)PH='fight'}
 else if(PH==='fight'){TL-=dt;const a=F[0].hp,b=F[1].hp;
  if(a<=0||b<=0||TL<=0){WN=a>b?0:b>a?1:-1;if(WN>=0)Wn[WN]++;PH='ko';PT=2.6;beep(90,.5,'sawtooth')}}
 else if(PH==='ko'){PT-=dt;if(PT<=0){if(Wn[0]>=CFG.roundsToWin||Wn[1]>=CFG.roundsToWin||RN>=5)PH='end';else{RN++;resetRound()}}}
}
function follow(p){
 if(p.ph!==PH||p.n!==RN){
  if(p.ph==='ready'&&(PH!=='ready'||p.n!==RN))resetRound();
  PH=p.ph;RN=p.n;if(PH==='fight')TL=CFG.seconds;if(PH==='ko')PT=2.6;
 }
 Wn=p.w||Wn;WN=typeof p.wn==='number'?p.wn:-2;
}
const OPP=()=>R?R.peers().find(p=>!p.isMe&&p.presence&&p.presence.r&&p.presence.r!==ROLE):null;
function update(dt){
 SH=Math.max(0,SH-dt*1.6);T+=dt;FX.forEach(e=>e.a-=dt*3);while(FX.length&&FX[0].a<=0)FX.shift();
 if(MODE==='local'){
  const fi=PH==='fight';
  for(let i=0;i<2;i++)stepLocal(F[i],F[1-i],dt,fi?IN[i]:Z,PD[i]);
  ctrl(dt);
 }else if(MODE==='net'){
  const me=F[ME],rf=F[1-ME],o=OPP();
  stepLocal(me,rf,dt,PH==='fight'?IN[ME]:Z,PD[ME]);
  if(o){const p=o.presence;
   if(typeof p.x==='number'){
    if(!rf.init){rf.x=p.x;rf.init=1}
    rf.x+=(p.x-rf.x)*Math.min(1,dt*15);rf.y=p.y;rf.face=p.fc;rf.st=p.st;rf.at=p.at;rf.t=p.t;rf.hp=p.hp;rf.sp=p.sp;rf.anim=p.an;
    (p.h||[]).forEach(h=>{if(!SEEN.has(h.id)){SEEN.add(h.id);hurt(me,h.d,h.dir)}});
   }
   if(ROLE==='h'){if(PH==='lobby'){RN=1;Wn=[0,0];WN=-2;resetRound()}ctrl(dt)}
   else if(p.r==='h'){follow(p);if(PH==='fight')TL-=dt}
  }else if(PH!=='lobby'&&PH!=='end'){PH='lobby'}
  NT+=dt;
  if(NT>.05&&R){NT=0;const pr={r:ROLE,x:+me.x.toFixed(1),y:+me.y.toFixed(1),fc:me.face,st:me.st,at:me.at,t:+me.t.toFixed(2),hp:me.hp,sp:Math.round(me.sp),an:+me.anim.toFixed(1),h:MY.hits};
   if(ROLE==='h'){pr.ph=PH;pr.n=RN;pr.w=Wn;pr.wn=WN}
   R.presence(pr).catch(()=>{})}
 }else{for(let i=0;i<2;i++)stepLocal(F[i],F[1-i],dt,Z,PD[i])}
 if(PH==='end'&&!ENDD){ENDD=1;endCard()}
 if(PH!=='end')ENDD=0;
}

/* ---------- drawing ---------- */
function bg(n){
 const k=(n-1)%3;
 if(k===0){const s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,'#f2a65a');s.addColorStop(1,'#f7e3b5');g.fillStyle=s;g.fillRect(0,0,800,GY);
  g.fillStyle='#b9824a';for(let i=0;i<6;i++){const x=i*140-20;g.fillRect(x,120,100,GY-120);g.fillStyle='#f2a65a';g.beginPath();g.arc(x+50,200,34,Math.PI,0);g.fillRect(x+16,200,68,GY-200);g.fill();g.fillStyle='#b9824a'}
  g.fillStyle='#d8b27a';g.fillRect(0,GY,800,80);g.strokeStyle='rgba(0,0,0,.15)';for(let x=0;x<800;x+=80){g.beginPath();g.moveTo(x,GY);g.lineTo(x-30,450);g.stroke()}
 }else if(k===1){const s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,'#070b24');s.addColorStop(1,'#25356b');g.fillStyle=s;g.fillRect(0,0,800,GY);
  for(let i=0;i<9;i++){const h=120+hh(i)*160,x=i*92-10;g.fillStyle='#10152e';g.fillRect(x,GY-h,82,h);for(let r=0;r<h/22;r++)for(let c=0;c<3;c++)if(hh(i*31+r*3+c)>.5){g.fillStyle='#ffd77a';g.fillRect(x+10+c*24,GY-h+8+r*22,10,12)}}
  g.fillStyle='#20232f';g.fillRect(0,GY,800,80);g.fillStyle='rgba(255,220,140,.25)';g.beginPath();g.arc(400,150,120,0,7);g.fill();g.fillStyle='#111';g.fillRect(398,150,5,GY-150);
 }else{const s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,'#7cc7f2');s.addColorStop(1,'#dff3ff');g.fillStyle=s;g.fillRect(0,0,800,GY);
  for(let i=0;i<120;i++){g.fillStyle=['#e74c3c','#f1c40f','#3498db','#ecf0f1'][i%4];g.fillRect((i*7)%800,GY-90-Math.floor(i/60)*14,5,8)}
  g.fillStyle='#3e8f3a';g.fillRect(0,GY-50,800,130);g.fillStyle='#c9a46a';g.fillRect(180,GY+8,440,50);
  g.fillStyle='#f4f4f0';for(let i=0;i<3;i++)g.fillRect(392+i*8,GY-40,3,34);
 }
}
function limb(x0,y0,x1,y1){g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()}
function fighter(f,i){
 const d=f.face,col=CFG.colors[i],ko=f.hp<=0&&f.st==='ko';
 g.save();g.translate(f.x,f.y);
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,2,26,6,0,0,7);g.fill();
 if(ko)g.rotate(-d*1.45);else if(f.st==='hit')g.rotate(-d*.18);
 g.lineCap='round';g.lineJoin='round';
 const sw=f.st==='walk'?Math.sin(f.anim*10):0,at=f.at?A[f.at]:null,ex=at?Math.sin(Math.min(1,f.t/at.d)*Math.PI):0;
 let ff=[d*14+sw*14*d,0],bf=[-d*14-sw*14*d,0];
 if(f.st==='jump'){ff=[d*16,-22];bf=[-d*8,-14]}
 if(f.at==='k')ff=[d*(16+78*ex),-10-42*ex];
 g.strokeStyle='#1f2433';g.lineWidth=13;limb(d*4,-55,ff[0],ff[1]);limb(-d*4,-55,bf[0],bf[1]);
 g.strokeStyle=col;g.lineWidth=26;limb(0,-58,0,-92);
 let hf=[d*18,-64+sw*3],hb=[-d*14,-66];
 if(f.at==='p'){hf=[d*(20+62*ex),-92]}
 if(f.at==='s'){hf=[d*(30+105*ex),-90];hb=[d*(20+85*ex),-80]}
 if(f.st==='block'){hf=[d*22,-100];hb=[d*16,-92]}
 g.strokeStyle='#e0ac7c';g.lineWidth=9;limb(0,-90,hb[0],hb[1]);limb(0,-90,hf[0],hf[1]);
 if(f.at==='s'){const r=g.createRadialGradient(hf[0],hf[1],0,hf[0],hf[1],40);r.addColorStop(0,'rgba(255,200,80,.9)');r.addColorStop(1,'rgba(255,120,0,0)');g.fillStyle=r;g.fillRect(hf[0]-40,hf[1]-40,80,80)}
 if(f.sp>=100&&f.hp>0){g.strokeStyle='rgba(255,190,70,'+(.5+.4*Math.sin(T*10))+')';g.lineWidth=3;g.beginPath();g.ellipse(0,-70,34,66,0,0,7);g.stroke()}
 g.save();g.beginPath();g.arc(0,-120,25,0,7);g.clip();g.fillStyle='#e0ac7c';g.fillRect(-25,-145,50,50);const im=IMGS[i];if(im.complete&&im.naturalWidth)g.drawImage(im,-25,-145,50,50);g.restore();
 g.strokeStyle=col;g.lineWidth=3;g.beginPath();g.arc(0,-120,25,0,7);g.stroke();
 g.restore();
}
function bar(x,w,f,i,right){
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x-3,10,w+6,26);
 const p=Math.max(0,f.hp/CFG.health);g.fillStyle=p>.3?'#3ddc84':'#ff4d4d';
 if(right)g.fillRect(x+w*(1-p),13,w*p,14);else g.fillRect(x,13,w*p,14);
 g.fillStyle='#ffb347';const s=f.sp/100;if(right)g.fillRect(x+w*(1-s),30,w*s,4);else g.fillRect(x,30,w*s,4);
 g.fillStyle='#fff';g.font='700 18px "Saira Condensed",sans-serif';g.textAlign=right?'right':'left';g.fillText(CFG.names[i],right?x+w:x,56);
 for(let r=0;r<CFG.roundsToWin;r++){g.fillStyle=r<Wn[i]?'#ffd84a':'rgba(255,255,255,.3)';g.beginPath();g.arc(right?x+4-14*r+w-8:x+8+14*r,70,5,0,7);g.fill()}
}
function banner(t,sub){g.textAlign='center';g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,170,800,90);g.fillStyle='#fff';g.font='700 56px "Saira Condensed",sans-serif';g.fillText(t,400,225);if(sub){g.font='600 18px Saira,sans-serif';g.fillText(sub,400,250)}}
function render(){
 g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#05060d';g.fillRect(0,0,cv.width,cv.height);
 g.translate(OX,OY);g.scale(SC,SC);g.beginPath();g.rect(0,0,800,450);g.clip();
 if(SH>0)g.translate((Math.random()-.5)*10*SH,(Math.random()-.5)*10*SH);
 bg(RN);
 const order=F[0].y<F[1].y?[1,0]:[0,1];order.forEach(i=>fighter(F[i],i));
 FX.forEach(e=>{g.globalAlpha=Math.max(0,e.a);g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();for(let k=0;k<8;k++){const a=k*.785,r=8+(1-e.a)*26;g.moveTo(e.x+Math.cos(a)*r*.4,e.y+Math.sin(a)*r*.4);g.lineTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r)}g.stroke();g.globalAlpha=1});
 bar(20,320,F[0],0,0);bar(460,320,F[1],1,1);
 g.textAlign='center';g.fillStyle='#fff';g.font='700 34px "Saira Condensed",sans-serif';g.fillText(PH==='fight'||PH==='ko'?Math.max(0,Math.ceil(TL)):CFG.seconds,400,38);
 g.font='600 13px Saira,sans-serif';g.fillText('Round '+RN,400,56);
 if(MODE==='menu')return;
 if(PH==='ready')banner(PT>1.1?'ROUND '+RN:'FIGHT!');
 else if(PH==='ko')banner(WN<0?(TL<=0?'TIME!':'DRAW'):'K.O.!',WN<0?'No winner this round':CFG.names[WN]+' wins the round');
 else if(PH==='lobby'&&NET)banner('WAITING…','Match code: '+CODE.toUpperCase()+'  (ask your sister to join)');
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}

/* ---------- screens and modes ---------- */
function menu(){
 if(R){R.leave().catch(()=>{});R=null}
 MODE='menu';NET=0;F=[mk(0),mk(1)];PH='lobby';RN=1;Wn=[0,0];WN=-2;$('#ctl').style.display='none';
 show('<div class=card><h1>Family Fight</h1><p>'+CFG.names[0]+' vs '+CFG.names[1]+'. Best of '+(CFG.roundsToWin*2-1)+' rounds. Land hits to fill your gold meter, then use your special move.</p>'+
 '<div class=row><button class=b data-a=local>Same screen</button><button class=g data-a=host>Create online match</button></div>'+
 '<div class=row><input id=code placeholder="match code" maxlength=8 aria-label="Match code"><button class=g data-a=join>Join online match</button></div><p id=msg></p>'+
 '<p><small>Keys. Player 1: A D to move, W jump, F punch, G kick, S block, R special. Player 2: arrow keys, K punch, L kick, down block, O special. On a tablet or phone, use the buttons below the game, and turn the phone sideways. Online play uses Firebase. Create a match and share its code with the other player.</small></p></div>');
}
function endCard(){
 const w=Wn[0]>Wn[1]?0:Wn[1]>Wn[0]?1:-1,host=MODE==='local'||ROLE==='h';
 show('<div class=card><h2>'+(w<0?'It’s a draw!':CFG.names[w]+' wins the match!')+'</h2><p>Rounds won: '+CFG.names[0]+' '+Wn[0]+', '+CFG.names[1]+' '+Wn[1]+'</p><div class=row>'+(host?'<button class=b data-a=again>Rematch</button>':'<small>Waiting for the host to start a rematch…</small>')+'<button class=g data-a=menu>Menu</button></div></div>');
}
function buildCtl(){
 const c=$('#ctl');c.innerHTML='';c.style.display='flex';
 const idx=MODE==='local'?[0,1]:[ME];
 idx.forEach(i=>{const p=document.createElement('div');p.className='pn';p.style.borderColor=CFG.colors[i];
  p.innerHTML='<div class=mv><button data-k=l aria-label="Left">◀</button><button data-k=u aria-label="Jump">▲</button><button data-k=r aria-label="Right">▶</button></div><div class=ac><button data-k=p>Punch</button><button data-k=k>Kick</button><button data-k=b>Block</button><button data-k=s class=s>Special</button></div>';
  p.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
   b.addEventListener('pointerdown',e=>{e.preventDefault();press(i,k)});
   ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>release(i,k)))});
  c.appendChild(p)});
 rs();
}
function press(i,k){const x=MODE==='net'?ME:i;if('lrb'.includes(k))IN[x][k]=1;else PD[x][k]=1}
function release(i,k){const x=MODE==='net'?ME:i;if('lrb'.includes(k))IN[x][k]=0}
function startLocal(){MODE='local';NET=0;Wn=[0,0];WN=-2;RN=1;resetRound();show('');buildCtl()}
async function online(role,code){
 try{
  note('Connecting to online match…');
  R=await window.startFirebaseRoom(role,code);
  ROLE=role;ME=role==='h'?0:1;CODE=code;MODE='net';NET=1;
  F=[mk(0),mk(1)];PH='lobby';RN=1;Wn=[0,0];WN=-2;show('');buildCtl();
  setTimeout(()=>{if(MODE==='net'&&PH==='lobby'&&!OPP()){
    const m=document.querySelector('#scr .card');
    if(m){const p=document.createElement('p');p.textContent='Still waiting. Ask the other player to enter code '+CODE.toUpperCase()+'.';m.appendChild(p)}
  }},9000);
 }catch(e){
  R=null;
  const reason=e&&e.message==='code-taken'?'That match code is already in use. Create another match.':e&&e.message==='room-full'?'That match is full or does not exist. Check the code.':'Could not connect ('+(e&&e.code||e&&e.message||'error')+'). Check your internet and Firebase setup.';
  note(reason);
 }
}
$('#scr').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='local')startLocal();
 else if(a==='host')online('h',Math.random().toString(36).slice(2,8));
 else if(a==='join'){const c=($('#code').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length<3)note('Type the match code first.');else online('j',c)}
 else if(a==='again'){Wn=[0,0];WN=-2;RN=1;resetRound();show('')}
 else if(a==='menu')menu()});
const KM={a:[0,'l'],d:[0,'r'],w:[0,'u'],s:[0,'b'],f:[0,'p'],g:[0,'k'],r:[0,'s'],ArrowLeft:[1,'l'],ArrowRight:[1,'r'],ArrowUp:[1,'u'],ArrowDown:[1,'b'],k:[1,'p'],l:[1,'k'],o:[1,'s']};
addEventListener('keydown',e=>{const m=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(!m||e.repeat)return;e.preventDefault();press(m[0],m[1])});
addEventListener('keyup',e=>{const m=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(m)release(m[0],m[1])});
menu();requestAnimationFrame(frame);
const splash=document.getElementById('splash');
setTimeout(()=>{if(splash){splash.classList.add('hide');setTimeout(()=>splash.remove(),300)}},2000);
})();
</script>
</body>
